<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расширенный отчёт по списаниям</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/burger.css">
    <link rel="stylesheet" href="/css/pages/reports_writeoffs.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a3c5e">
</head>
<body>

<main class="report-page">
    <div class="filters">
        <label>С: <input type="date" id="dateFrom"></label>
        <label>По: <input type="date" id="dateTo"></label>
        <button class="btn btn-primary btn-sm" id="btnLoad">Загрузить</button>
    </div>

    <div class="card">
        <h2>Списания по месяцам</h2>
        <div class="chart-container">
            <canvas id="chartMonthly"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Топ-20 списываемых позиций</h2>
        <div class="chart-container">
            <canvas id="chartTopItems"></canvas>
        </div>
        <div class="table-wrapper">
            <table class="table-compact" id="topItemsTable">
                <thead>
                <tr>
                    <th>Код</th>
                    <th>Название</th>
                    <th>Кол-во</th>
                    <th>Заявок</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>По оборудованию</h2>
        <div class="chart-container">
            <canvas id="chartEquipment"></canvas>
        </div>
        <div class="table-wrapper">
            <table class="table-compact" id="equipmentTable">
                <thead>
                <tr>
                    <th>Оборудование</th>
                    <th>Кол-во</th>
                    <th>Заявок</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</main>

<script src="/js/library/chart.min.js"></script>
<script src="/js/utils/dom.js"></script>
<script src="/js/utils/auth.js"></script>
<script src="/js/components/profile-ui.js"></script>
<script src="/js/components/layout.js"></script>
<script src="/js/pages/reports_writeoffs.js"></script>

</body>
</html>
