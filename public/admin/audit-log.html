<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал действий</title>
  <link rel="stylesheet" href="/css/base.css?v={APP_VERSION}">
  <link rel="stylesheet" href="/css/components.css?v={APP_VERSION}">
  <style>
    .log-container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .log-table th, .log-table td { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
    .log-table th { background: #f7f9fb; font-weight: 600; white-space: nowrap; }
    .log-filters { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/index.html" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Журнал действий</span>
      </div>
    </div>
  </header>

  <main class="log-container">
    <div class="log-filters">
      <input type="text" id="filterUser" placeholder="Пользователь">
      <select id="filterAction">
        <option value="">Все действия</option>
        <option value="login">Вход</option>
        <option value="logout">Выход</option>
        <option value="create_item">Добавление запчасти</option>
        <option value="delete_item">Удаление запчасти</option>
        <option value="create_writeoff">Создание заявки на списание</option>
        <option value="approve_writeoff">Подтверждение списания</option>
        <option value="reject_writeoff">Отклонение списания</option>
        <option value="create_user">Создание пользователя</option>
        <option value="update_user">Редактирование пользователя</option>
        <option value="delete_user">Удаление пользователя</option>
        <option value="send_mailing">Рассылка</option>
      </select>
      <button class="btn btn-primary btn-sm" id="applyFilter">Применить</button>
    </div>

    <div class="table-wrapper">
      <table class="log-table" id="logTable">
        <thead>
          <tr>
            <th>Время</th><th>Пользователь</th><th>Роль</th><th>Действие</th><th>Тип</th><th>ID</th><th>Детали</th><th>IP</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="/js/utils.js?v={APP_VERSION}"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/welcome.html';

    async function loadLogs(filters = {}) {
      const params = new URLSearchParams(filters).toString();
      const res = await fetch(`/api/audit-log?${params}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return alert('Ошибка загрузки');
      const data = await res.json();
      const tbody = document.querySelector('#logTable tbody');
      tbody.innerHTML = data.map(r => `
        <tr>
          <td>${new Date(r.created_at).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' })}</td>
          <td>${r.username || '—'}</td>
          <td>${r.role || '—'}</td>
          <td>${r.action}</td>
          <td>${r.entity_type || ''}</td>
          <td>${r.entity_id || ''}</td>
          <td>${r.details ? JSON.stringify(r.details) : ''}</td>
          <td>${r.ip_address || ''}</td>
        </tr>
      `).join('');
    }

    document.getElementById('applyFilter').addEventListener('click', () => {
      const user = document.getElementById('filterUser').value.trim();
      const action = document.getElementById('filterAction').value;
      loadLogs({ user, action });
    });

    loadLogs();
  </script>
</body>
</html>
