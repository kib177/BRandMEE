<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Справочники</title>
  <link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/utilities.css">
<link rel="stylesheet" href="../css/mobile.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="/css/burger.css">
<meta name="theme-color" content="#1a3c5e">
</head>
  
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/index.html" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Справочники</span>
      </div>
    </div>
  </header>

  <main style="max-width:1000px; margin:2rem auto; padding:0 1rem;">
    <!-- Типы запчастей -->
    <div class="accordion collapsed" id="accordionTypes">
      <div class="accordion-header">
        <span>Типы запчастей</span>
         <button class="btn btn-danger btn-sm" id="cleanupTypes">🗑️ Очистить неиспользуемые</button>
      </div>
      <div class="accordion-body">
        <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
          <input type="text" id="newTypeName" placeholder="Новый тип" style="flex:1;">
          <button class="btn btn-primary btn-sm" id="addType">Добавить</button>
        </div>
        <div class="table-wrapper">
          <table id="typesTable" class="compact-table">
            <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Оборудование -->
    <div class="accordion collapsed" id="accordionEquip">
      <div class="accordion-header">
        <span>Оборудование</span>
        <button class="btn btn-danger btn-sm" id="cleanupEquip">🗑️ Очистить неиспользуемые</button>
      </div>
      <div class="accordion-body">
        <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
          <input type="text" id="newEquipName" placeholder="Новое оборудование" style="flex:1;">
          <button class="btn btn-primary btn-sm" id="addEquip">Добавить</button>
        </div>
        <div class="table-wrapper">
          <table id="equipTable" class="compact-table">
            <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Модалка истории неисправностей -->
<div class="modal-overlay hidden" id="incidentModalOverlay">
  <div class="modal" style="max-width: 700px;">
    <h2 id="incidentModalTitle">История неисправностей</h2>
    <div id="incidentContent" style="margin-bottom: 1rem;"></div>
    <div class="form-actions">
      <button class="btn btn-outline" id="btnCloseIncidentModal">Закрыть</button>
      <button class="btn btn-primary" id="btnAddIncident" style="display:none;">➕ Добавить неисправность</button>
    </div>
  </div>
</div>

<!-- Модалка добавления/редактирования неисправности -->
<div class="modal-overlay hidden" id="incidentFormOverlay">
  <div class="modal" style="max-width: 600px;">
    <h2 id="incidentFormTitle">Новая неисправность</h2>
    <form id="incidentForm">
      <input type="hidden" id="incidentId">
      <input type="hidden" id="incidentEquipmentId">
      <div class="form-group">
        <label>Оборудование</label>
        <input type="text" id="incidentEquipmentName" readonly>
      </div>
      <div class="form-group">
        <label>Заголовок *</label>
        <input type="text" id="incidentTitle" required>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="incidentDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Причина</label>
        <textarea id="incidentRootCause" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Решение</label>
        <textarea id="incidentSolution" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Статус</label>
        <select id="incidentStatus">
          <option value="open">Открыт</option>
          <option value="in_progress">В работе</option>
          <option value="resolved">Решён</option>
          <option value="closed">Закрыт</option>
        </select>
      </div>
      <div class="form-group">
        <label>Запчасти</label>
        <div id="incidentPartsSelect" style="height: auto;"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="btnCancelIncidentForm">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

  <script src="../js/auth.js"></script>
  <script src="../js/admin/directories.js"></script>
  <script src="../js/theme.js"></script>
  <script src="/js/profile-ui.js"></script>
</body>
</html>
