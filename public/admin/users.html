<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление пользователями и отделами</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <style>
    .admin-page { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .section { margin-bottom: 2rem; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1.5rem; }
    .flex-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .form-inline { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .form-inline input, .form-inline select { padding: 0.5rem; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: #fafbfc; }
    /* Таблицы с горизонтальной прокруткой */
    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: var(--radius); }
    .table-users { width: 100%; border-collapse: collapse; font-size: 0.87rem; min-width: 700px; }
    .table-users th, .table-users td { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
    .table-users th { background: #f7f9fb; font-weight: 600; white-space: nowrap; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; margin: 0 0.2rem; }
    .hidden { display: none !important; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem; max-width: 500px; width: 90%; box-shadow: var(--shadow-lg); }
    .modal h2 { margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--text-secondary); }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: #fafbfc; }
    .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Управление пользователями</span>
      </div>
    </div>
  </header>

  <main class="admin-page">
    <div class="section">
      <h2>Пользователи</h2>
      <div class="flex-row">
        <button class="btn btn-primary" id="btnAddUser">+ Добавить пользователя</button>
        <button class="btn btn-outline" id="btnRefreshUsers">🔄 Обновить</button>
      </div>
      <div class="table-wrapper">
        <table class="table-users" id="usersTable">
          <thead>
            <tr>
              <th>ID</th><th>Логин</th><th>Email</th><th>Роль</th><th>Отдел</th><th>Действия</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2>Отделы</h2>
      <div class="form-inline" id="addDeptForm">
        <input type="text" id="newDeptName" placeholder="Название отдела">
        <button class="btn btn-primary btn-sm" id="btnAddDept">Добавить</button>
      </div>
      <div class="table-wrapper" style="margin-top:1rem;">
        <table class="table-users" id="deptsTable">
          <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Модальное окно пользователя -->
  <div class="modal-overlay hidden" id="userModalOverlay">
    <div class="modal">
      <h2 id="userModalTitle">Добавить пользователя</h2>
      <form id="userForm">
        <input type="hidden" id="userId">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" required maxlength="50">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <div class="form-group">
          <label for="password">Пароль <small>(оставьте пустым при редактировании)</small></label>
          <input type="password" id="password">
        </div>
        <div class="form-group">
          <label for="role">Роль</label>
          <select id="role">
            <option value="user">Пользователь</option>
            <option value="storekeeper">Кладовщик</option>
            <option value="moderator">Модератор</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div class="form-group">
          <label for="department">Отдел</label>
          <select id="department">
            <option value="">— Без отдела —</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="btnCancelUser">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/admin-users.js"></script>
</body>
</html>
