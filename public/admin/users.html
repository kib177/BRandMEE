<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление пользователями и отделами</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <style>
    .admin-page { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .section { margin-bottom: 2rem; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1.5rem; }
    .flex-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .form-inline { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .form-inline input, .form-inline select { padding: 0.5rem; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: #fafbfc; }
    .table-users { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    .table-users th, .table-users td { padding: 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
    .table-users th { background: #f7f9fb; font-weight: 600; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; margin: 0 0.2rem; }
    .hidden { display: none !important; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem; max-width: 500px; width: 90%; box-shadow: var(--shadow-lg); }
    .modal h2 { margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--text-secondary); }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: #fafbfc; }
    .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Управление пользователями</span>
      </div>
    </div>
  </header>

  <main class="admin-page">
    <div class="section">
      <h2>Пользователи</h2>
      <div class="flex-row">
        <button class="btn btn-primary" id="btnAddUser">+ Добавить пользователя</button>
        <button class="btn btn-outline" id="btnRefreshUsers">🔄 Обновить</button>
      </div>
      <table class="table-users" id="usersTable">
        <thead>
          <tr>
            <th>ID</th><th>Логин</th><th>Email</th><th>Роль</th><th>Отдел</th><th>Создан</th><th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section">
      <h2>Отделы</h2>
      <div class="form-inline" id="addDeptForm">
        <input type="text" id="newDeptName" placeholder="Название отдела">
        <button class="btn btn-primary btn-sm" id="btnAddDept">Добавить</button>
      </div>
      <table class="table-users" id="deptsTable" style="margin-top:1rem;">
        <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Модальное окно пользователя -->
  <div class="modal-overlay hidden" id="userModalOverlay">
    <div class="modal">
      <h2 id="userModalTitle">Добавить пользователя</h2>
      <form id="userForm">
        <input type="hidden" id="userId">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" required maxlength="50">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <div class="form-group">
          <label for="password">Пароль <small>(оставьте пустым при редактировании, если не хотите менять)</small></label>
          <input type="password" id="password">
        </div>
        <div class="form-group">
          <label for="role">Роль</label>
          <select id="role">
            <option value="user">Пользователь</option>
            <option value="storekeeper">Кладовщик</option>
            <option value="moderator">Модератор</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div class="form-group">
          <label for="department">Отдел</label>
          <select id="department">
            <option value="">— Без отдела —</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="btnCancelUser">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script>
    const token = sessionStorage.getItem('token');
    if (!token) window.location.href = '/';

    const API = '/api/users';

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          ...options.headers,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      if (res.status === 401) {
        alert('Сессия истекла');
        sessionStorage.removeItem('token');
        window.location.href = '/';
        return null;
      }
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Ошибка');
      }
      return res.json();
    }

    // ========== ПОЛЬЗОВАТЕЛИ ==========
    async function loadUsers() {
      try {
        const users = await apiFetch(API);
        if (!users) return;
        const tbody = document.querySelector('#usersTable tbody');
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.email || '—'}</td>
            <td>${u.role}</td>
            <td>${u.department_name || '—'}</td>
            <td>${new Date(u.created_at).toLocaleDateString('ru')}</td>
            <td>
              <button class="btn-icon" title="Редактировать" onclick="editUser(${u.id})">✏️</button>
              <button class="btn-icon" title="Удалить" onclick="deleteUser(${u.id})">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        alert('Ошибка загрузки пользователей: ' + e.message);
      }
    }

    async function loadDepartmentsForForm() {
      try {
        const depts = await apiFetch(`${API}/departments`);
        const select = document.getElementById('department');
        select.innerHTML = '<option value="">— Без отдела —</option>' +
          depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      } catch (e) {}
    }

    window.editUser = function(id) {
      fetch(`${API}`, { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.json())
        .then(users => {
          const user = users.find(u => u.id == id);
          if (!user) return;
          document.getElementById('userId').value = user.id;
          document.getElementById('username').value = user.username;
          document.getElementById('email').value = user.email || '';
          document.getElementById('password').value = '';
          document.getElementById('role').value = user.role;
          document.getElementById('department').value = user.department_id || '';
          document.getElementById('userModalTitle').textContent = 'Редактировать пользователя';
          document.getElementById('userModalOverlay').classList.remove('hidden');
        });
    };

    window.deleteUser = async function(id) {
      if (!confirm('Удалить пользователя?')) return;
      try {
        await apiFetch(`${API}/${id}`, { method: 'DELETE' });
        loadUsers();
      } catch (e) { alert(e.message); }
    };

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('userId').value;
      const payload = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim() || null,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
        department_id: document.getElementById('department').value || null
      };

      try {
        if (userId) {
          if (!payload.password) delete payload.password;
          await apiFetch(`${API}/${userId}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          await apiFetch(API, { method: 'POST', body: JSON.stringify(payload) });
        }
        document.getElementById('userModalOverlay').classList.add('hidden');
        loadUsers();
      } catch (e) {
        alert(e.message);
      }
    });

    document.getElementById('btnAddUser').addEventListener('click', () => {
      document.getElementById('userId').value = '';
      document.getElementById('userForm').reset();
      document.getElementById('userModalTitle').textContent = 'Добавить пользователя';
      document.getElementById('userModalOverlay').classList.remove('hidden');
      loadDepartmentsForForm();
    });

    document.getElementById('btnCancelUser').addEventListener('click', () => {
      document.getElementById('userModalOverlay').classList.add('hidden');
    });

    document.getElementById('btnRefreshUsers').addEventListener('click', loadUsers);

    // ========== ОТДЕЛЫ ==========
    async function loadDepartments() {
      try {
        const depts = await apiFetch(`${API}/departments`);
        const tbody = document.querySelector('#deptsTable tbody');
        tbody.innerHTML = depts.map(d => `
          <tr>
            <td>${d.id}</td>
            <td>${d.name}</td>
            <td>
              <button class="btn-icon" title="Переименовать" onclick="renameDept(${d.id}, '${d.name}')">✏️</button>
              <button class="btn-icon" title="Удалить" onclick="deleteDept(${d.id})">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        alert('Ошибка загрузки отделов: ' + e.message);
      }
    }

    async function addDept() {
      const name = document.getElementById('newDeptName').value.trim();
      if (!name) return alert('Введите название');
      try {
        await apiFetch(`${API}/departments`, { method: 'POST', body: JSON.stringify({ name }) });
        document.getElementById('newDeptName').value = '';
        loadDepartments();
        loadDepartmentsForForm();
      } catch (e) { alert(e.message); }
    }

    window.renameDept = async function(id, oldName) {
      const name = prompt('Новое название:', oldName);
      if (!name || !name.trim()) return;
      try {
        await apiFetch(`${API}/departments/${id}`, { method: 'PUT', body: JSON.stringify({ name }) });
        loadDepartments();
        loadDepartmentsForForm();
      } catch (e) { alert(e.message); }
    };

    window.deleteDept = async function(id) {
      if (!confirm('Удалить отдел? Это возможно только если нет связанных пользователей и инвентаря.')) return;
      try {
        await apiFetch(`${API}/departments/${id}`, { method: 'DELETE' });
        loadDepartments();
        loadDepartmentsForForm();
      } catch (e) { alert(e.message); }
    };

    document.getElementById('btnAddDept').addEventListener('click', addDept);
    document.getElementById('newDeptName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addDept(); }
    });

    // Старт
    loadUsers();
    loadDepartments();
  </script>
</body>
</html>
