<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление списаниями</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filters { display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap; align-items:flex-end; }
    .filters select, .filters input { padding:0.5rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:0.5rem; border-bottom:1px solid #ddd; }
    .status { font-weight:bold; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Администрирование списаний</span>
      </div>
      <div>
        <button class="btn btn-sm btn-outline" id="btnLogout" style="color:#fff; border-color:#fff;">Выйти</button>
      </div>
    </div>
  </header>

  <main style="max-width:1200px; margin:2rem auto; padding:0 1rem;">
    <div class="filters">
      <select id="filterStatus">
        <option value="">Все статусы</option>
        <option value="pending" selected>Ожидают</option>
        <option value="approved">Подтверждённые</option>
        <option value="rejected">Отклонённые</option>
      </select>
      <input type="date" id="filterFrom" placeholder="С">
      <input type="date" id="filterTo" placeholder="По">
      <input type="text" id="filterEquip" placeholder="Оборудование">
      <button class="btn btn-primary btn-sm" id="applyFilter">Применить</button>
    </div>

    <table id="requestsTable">
      <thead><tr>
        <th>ID</th><th>Код</th><th>Название</th><th>Кол-во</th><th>Оборудование</th>
        <th>Запросил</th><th>Дата</th><th>Статус</th><th>Действие</th>
      </tr></thead>
      <tbody></tbody>
    </table>

    <hr>
    <h2>Отчёт за год</h2>
    <select id="reportYear">
      <option value="2025">2025</option>
      <option value="2026">2026</option>
    </select>
    <button class="btn btn-outline btn-sm" id="loadReport">Загрузить</button>
    <div id="reportArea" style="margin-top:1rem;"></div>
  </main>

  <script src="js/utils.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const API = '/api/write-offs';

    let token = sessionStorage.getItem('token');
    if (!token) {
      // запросить пароль
      const password = prompt('Введите пароль администратора');
      fetch('/api/inventory/auth', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.token) {
          token = data.token;
          sessionStorage.setItem('token', token);
        } else {
          alert('Неверный пароль');
          window.location.href = '/';
        }
      });
    }

    function authHeaders() {
      return { 'Authorization': `Bearer ${token}` };
    }

    async function loadRequests(params = {}) {
      const url = new URL(API, window.location.origin);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
      try {
        const res = await fetch(url, { headers: authHeaders() });
        if (!res.ok) throw new Error('Ошибка загрузки');
        const data = await res.json();
        renderTable(data);
      } catch(e) {
        alert(e.message);
      }
    }

    function renderTable(requests) {
      const tbody = $('#requestsTable tbody');
      tbody.innerHTML = requests.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.item_code}</td>
          <td>${r.item_name}</td>
          <td>${r.quantity} ${r.unit}</td>
          <td>${r.equipment || '—'}</td>
          <td>${r.requested_by}</td>
          <td>${new Date(r.requested_at).toLocaleDateString('ru')}</td>
          <td class="status" style="color:${r.status==='approved'?'green':r.status==='rejected'?'red':'orange'}">${r.status}</td>
          <td>
            ${r.status === 'pending' ? `
              <button class="btn btn-success btn-sm" onclick="resolve(${r.id},'approved')">✅</button>
              <button class="btn btn-danger btn-sm" onclick="resolve(${r.id},'rejected')">❌</button>
            ` : ''}
          </td>
        </tr>
      `).join('');
    }

    async function resolve(id, status) {
      if (!confirm(`Подтвердить ${status}?`)) return;
      try {
        const res = await fetch(`${API}/${id}`, {
          method: 'PATCH',
          headers: { ...authHeaders(), 'Content-Type':'application/json' },
          body: JSON.stringify({ status })
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
        } else {
          loadRequests(getCurrentFilters());
        }
      } catch(e) {
        alert('Ошибка сети');
      }
    }

    function getCurrentFilters() {
      return {
        status: $('#filterStatus').value,
        from: $('#filterFrom').value,
        to: $('#filterTo').value,
        equipment: $('#filterEquip').value
      };
    }

    $('#applyFilter').addEventListener('click', () => loadRequests(getCurrentFilters()));
    $('#filterStatus').addEventListener('change', () => loadRequests(getCurrentFilters()));

    // Отчёт
    $('#loadReport').addEventListener('click', async () => {
      const year = $('#reportYear').value;
      try {
        const res = await fetch(`${API}/report?year=${year}`, { headers: authHeaders() });
        const data = await res.json();
        let html = `<h3>${year} год</h3>`;
        html += '<table><tr><th>Месяц</th><th>Списано единиц</th><th>Заявок</th></tr>';
        const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
        data.monthly.forEach(m => {
          html += `<tr><td>${months[parseInt(m.month)-1]}</td><td>${m.total_quantity}</td><td>${m.count_requests}</td></tr>`;
        });
        html += '</table>';
        html += '<h4>По оборудованию</h4><ul>';
        data.byEquipment.forEach(e => {
          html += `<li>${e.equipment || 'Без указания'}: ${e.total_quantity} ед. (${e.count_requests} заявок)</li>`;
        });
        html += '</ul>';
        $('#reportArea').innerHTML = html;
      } catch(e) { alert('Ошибка загрузки отчёта'); }
    });

    $('#btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem('token');
      window.location.href = '/';
    });

    // Загрузка при старте
    loadRequests({ status: 'pending' });
  </script>
</body>
</html>
