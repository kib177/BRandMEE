<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Справочники</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Справочники</span>
      </div>
      <div>
        <button class="btn-logout" id="btnLogout">Выйти</button>
      </div>
    </div>
  </header>

  <main style="max-width:1000px; margin:2rem auto; padding:0 1rem;">
    <h2>Типы запчастей</h2>
    <div class="filters" style="margin-bottom:1rem;">
      <input type="text" id="newTypeName" placeholder="Новый тип">
      <button class="btn btn-primary btn-sm" id="addType">Добавить</button>
    </div>
    <table id="typesTable" class="table-wrapper">
      <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
      <tbody></tbody>
    </table>

    <hr>

    <h2>Оборудование</h2>
    <div class="filters" style="margin-bottom:1rem;">
      <input type="text" id="newEquipName" placeholder="Новое оборудование">
      <button class="btn btn-primary btn-sm" id="addEquip">Добавить</button>
    </div>
    <table id="equipTable" class="table-wrapper">
      <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const API = '/api/directories';
    let token = sessionStorage.getItem('token');

    // Проверка авторизации
    async function checkAuth() {
      if (!token) {
        window.location.href = '/';
        return;
      }
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        if (data.user.role !== 'admin' && data.user.role !== 'moderator') {
          alert('Доступ запрещён');
          window.location.href = '/';
        }
      } catch (e) {
        window.location.href = '/';
      }
    }

    function authHeaders() {
      return { 'Authorization': `Bearer ${token}` };
    }

    // Загрузка типов
    async function loadTypes() {
      try {
        const res = await fetch(`${API}/types`, { headers: authHeaders() });
        const types = await res.json();
        const tbody = $('#typesTable tbody');
        tbody.innerHTML = types.map(t => `
          <tr>
            <td>${t.id}</td>
            <td><input type="text" value="${t.name}" data-id="${t.id}" class="type-edit"></td>
            <td>
              <button class="btn btn-sm btn-outline save-type" data-id="${t.id}">💾</button>
              <button class="btn btn-sm btn-danger delete-type" data-id="${t.id}">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    // Загрузка оборудования
    async function loadEquipment() {
      try {
        const res = await fetch(`${API}/equipment`, { headers: authHeaders() });
        const equips = await res.json();
        const tbody = $('#equipTable tbody');
        tbody.innerHTML = equips.map(e => `
          <tr>
            <td>${e.id}</td>
            <td><input type="text" value="${e.name}" data-id="${e.id}" class="equip-edit"></td>
            <td>
              <button class="btn btn-sm btn-outline save-equip" data-id="${e.id}">💾</button>
              <button class="btn btn-sm btn-danger delete-equip" data-id="${e.id}">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    // Добавление типа
    $('#addType').addEventListener('click', async () => {
      const name = $('#newTypeName').value.trim();
      if (!name) return alert('Введите название');
      try {
        const res = await fetch(`${API}/types`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
          return;
        }
        $('#newTypeName').value = '';
        loadTypes();
      } catch (e) { alert('Ошибка'); }
    });

    // Добавление оборудования
    $('#addEquip').addEventListener('click', async () => {
      const name = $('#newEquipName').value.trim();
      if (!name) return alert('Введите название');
      try {
        const res = await fetch(`${API}/equipment`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error);
          return;
        }
        $('#newEquipName').value = '';
        loadEquipment();
      } catch (e) { alert('Ошибка'); }
    });

    // Обработчики сохранения/удаления (через делегирование)
    document.addEventListener('click', async (e) => {
      if (e.target.classList.contains('save-type')) {
        const id = e.target.dataset.id;
        const input = document.querySelector(`input.type-edit[data-id="${id}"]`);
        const name = input.value.trim();
        if (!name) return;
        try {
          const res = await fetch(`${API}/types/${id}`, {
            method: 'PUT',
            headers: { ...authHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error);
          } else {
            loadTypes();
          }
        } catch (e) { alert('Ошибка'); }
      } else if (e.target.classList.contains('delete-type')) {
        if (!confirm('Удалить тип?')) return;
        const id = e.target.dataset.id;
        try {
          const res = await fetch(`${API}/types/${id}`, {
            method: 'DELETE',
            headers: authHeaders()
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error);
          } else {
            loadTypes();
          }
        } catch (e) { alert('Ошибка'); }
      } else if (e.target.classList.contains('save-equip')) {
        const id = e.target.dataset.id;
        const input = document.querySelector(`input.equip-edit[data-id="${id}"]`);
        const name = input.value.trim();
        if (!name) return;
        try {
          const res = await fetch(`${API}/equipment/${id}`, {
            method: 'PUT',
            headers: { ...authHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error);
          } else {
            loadEquipment();
          }
        } catch (e) { alert('Ошибка'); }
      } else if (e.target.classList.contains('delete-equip')) {
        if (!confirm('Удалить оборудование?')) return;
        const id = e.target.dataset.id;
        try {
          const res = await fetch(`${API}/equipment/${id}`, {
            method: 'DELETE',
            headers: authHeaders()
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error);
          } else {
            loadEquipment();
          }
        } catch (e) { alert('Ошибка'); }
      }
    });

    $('#btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem('token');
      window.location.href = '/';
    });

    // Инициализация
    checkAuth().then(() => {
      loadTypes();
      loadEquipment();
    });
  </script>
</body>
</html>
