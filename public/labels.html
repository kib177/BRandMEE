<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор наклеек</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/burger.css">
  <link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/mobile.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a3c5e">
  <style>
    .labels-page { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1.5rem; margin-bottom: 1.5rem; }
    .flex-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .search-box { margin-bottom: 0.8rem; }
    .search-box input { width: 100%; padding: 0.5rem; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; }
    .item-select { width: 100%; max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem; }
    .item-select label { display: block; margin-bottom: 0.2rem; cursor: pointer; }
    .no-results { text-align: center; padding: 1rem; color: var(--text-secondary); font-style: italic; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/index.html" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Генератор наклеек</span>
      </div>
    </div>
  </header>

  <main class="labels-page">
    <div class="card">
      <h2>Выберите позиции для наклеек</h2>
      <div class="search-box">
        <input type="text" id="searchItems" placeholder="Поиск по коду или названию..." autocomplete="off">
      </div>
      <div class="flex-row" style="margin-bottom:1rem;">
        <button class="btn btn-outline btn-sm" id="btnSelectAll">Выбрать все</button>
        <button class="btn btn-outline btn-sm" id="btnDeselectAll">Снять все</button>
      </div>
      <div class="item-select" id="itemList">
        <!-- заполнится динамически -->
      </div>
      <div class="flex-row" style="margin-top:1rem;">
        <button class="btn btn-primary" id="btnGenerate">Сгенерировать наклейки</button>
        <span id="status"></span>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/labels.js"></script>
  <script src="/js/profile-ui.js"></script>
</body>
</html>
