<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор наклеек</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/burger.css">
    <link rel="stylesheet" href="/css/pages/labels.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a3c5e">
</head>
<body>

<main class="labels-page">
    <div class="card">
        <h2>Выберите позиции для наклеек</h2>
        <div class="search-box">
            <input type="text" id="searchItems" placeholder="Поиск по коду или названию..." autocomplete="off">
        </div>
        <div class="flex-row mb-1">
            <button class="btn btn-outline btn-sm" id="btnSelectAll">Выбрать все</button>
            <button class="btn btn-outline btn-sm" id="btnDeselectAll">Снять все</button>
        </div>
        <div class="item-select" id="itemList">
            <!-- заполнится динамически -->
        </div>
        <div class="flex-row mt-1">
            <button class="btn btn-primary" id="btnGenerate">Сгенерировать наклейки</button>
            <span id="status"></span>
        </div>
    </div>
</main>

<script src="/js/utils/dom.js"></script>
<script src="/js/utils/auth.js"></script>
<script src="/js/components/profile-ui.js"></script>
<script src="/js/modules/labels.js"></script>
<script src="/js/components/layout.js"></script>

</body>
</html>
