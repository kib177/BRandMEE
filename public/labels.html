<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор наклеек</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a3c5e">
  <style>
    .labels-page { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 1.5rem; margin-bottom: 1.5rem; }
    .flex-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .item-select { width: 100%; max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem; }
    .item-select label { display: block; margin-bottom: 0.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/index.html" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem;">→ Генератор наклеек</span>
      </div>
    </div>
  </header>

  <main class="labels-page">
    <div class="card">
      <h2>Выберите позиции для наклеек</h2>
      <div class="flex-row" style="margin-bottom:1rem;">
        <button class="btn btn-outline btn-sm" id="btnSelectAll">Выбрать все</button>
        <button class="btn btn-outline btn-sm" id="btnDeselectAll">Снять все</button>
      </div>
      <div class="item-select" id="itemList">
        <!-- заполнится динамически -->
      </div>
      <div class="flex-row" style="margin-top:1rem;">
        <button class="btn btn-primary" id="btnGenerate">Сгенерировать наклейки</button>
        <span id="status"></span>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/library/xlsx.full.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/welcome.html';

    // Загрузка списка позиций
    fetch('/api/labels/items', { headers: { 'Authorization': `Bearer ${token}` } })
      .then(r => r.json())
      .then(items => {
        const container = document.getElementById('itemList');
        container.innerHTML = items.map(i => `<label><input type="checkbox" value="${i.code}"> ${i.code} – ${i.name}</label>`).join('');
      });

    document.getElementById('btnSelectAll').addEventListener('click', () => {
      document.querySelectorAll('#itemList input[type="checkbox"]').forEach(cb => cb.checked = true);
    });
    document.getElementById('btnDeselectAll').addEventListener('click', () => {
      document.querySelectorAll('#itemList input[type="checkbox"]').forEach(cb => cb.checked = false);
    });

    document.getElementById('btnGenerate').addEventListener('click', async () => {
      const checked = document.querySelectorAll('#itemList input[type="checkbox"]:checked');
      const codes = Array.from(checked).map(cb => cb.value);
      if (codes.length === 0) {
        if (!confirm('Ни одна позиция не выбрана. Сгенерировать наклейки для ВСЕХ позиций?')) return;
      }

      const status = document.getElementById('status');
      status.textContent = 'Генерация...';

      try {
        const res = await fetch('/api/labels/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ codes: codes.length > 0 ? codes : null })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Ошибка');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'labels.xlsx';
        a.click();
        URL.revokeObjectURL(url);

        status.textContent = 'Наклейки сгенерированы';
      } catch (e) {
        status.textContent = 'Ошибка: ' + e.message;
      }
    });
  </script>
</body>
</html>
