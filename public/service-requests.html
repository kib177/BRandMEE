<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Докладные записки</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="/css/burger.css">
    <link rel="stylesheet" href="/css/pages/service-requests.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a3c5e">
</head>
<body>

<main class="sr-page">
    <div class="sr-summary">
        <div class="sr-summary-card">
            <span class="sr-label">Всего</span>
            <span class="sr-value" id="srSumTotal">0</span>
        </div>
        <div class="sr-summary-card draft">
            <span class="sr-label">Черновики</span>
            <span class="sr-value" id="srSumDraft">0</span>
        </div>
        <div class="sr-summary-card in_progress">
            <span class="sr-label">В работе</span>
            <span class="sr-value" id="srSumInProgress">0</span>
        </div>
        <div class="sr-summary-card approved">
            <span class="sr-label">Согласовано</span>
            <span class="sr-value" id="srSumApproved">0</span>
        </div>
        <div class="sr-summary-card done">
            <span class="sr-label">Выполнено</span>
            <span class="sr-value" id="srSumDone">0</span>
        </div>
        <div class="sr-summary-card rejected">
            <span class="sr-label">Отклонено</span>
            <span class="sr-value" id="srSumRejected">0</span>
        </div>
    </div>

    <div class="sr-filters">
    <select id="srFilterStatus" class="filter-select">
        <option value="">Все статусы</option>
        <option value="draft">Черновик</option>
        <option value="submitted">Подана</option>
        <option value="approved">Согласована</option>
        <option value="in_progress">В работе</option>
        <option value="done">Закрыта</option>
        <option value="rejected">Отклонена</option>
        <option value="cancelled">Отменена</option>
    </select>
    <input type="text" id="srSearch" placeholder="Поиск по №, заголовку, описанию">
    <button class="btn btn-outline btn-sm" id="srBtnReset">Сброс</button>
    <button class="btn btn-primary btn-sm storekeeper-only" id="srBtnCreate">➕ Создать ДЗ</button>
</div>

    <div class="table-wrapper">
        <table class="sr-table" id="srTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>№</th>
                    <th>Дата</th>
                    <th>Заголовок</th>
                    <th>Вид работ</th>
                    <th>Участок</th>
                    <th>Запчасти</th>
                    <th>Ответственный</th>
                    <th>Нужно к</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<!-- Модалка создания/редактирования -->
<div class="modal-overlay hidden" id="srFormOverlay">
    <div class="modal" style="max-width: 780px;">
        <button class="btn-icon-info" id="srFormClose" style="position:absolute; top:10px; right:10px;">✕</button>
        <h2 id="srFormTitle">Новая докладная записка</h2>
        <form id="srForm">
            <input type="hidden" id="srId">
            <div class="form-row">
                <div class="form-group">
                    <label>Номер *</label>
                    <input type="text" id="srNumber" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>Вид работ *</label>
                    <select id="srWorkType" required>
                        <option value="">— Выберите —</option>
                        <option value="Модернизация">Модернизация</option>
                        <option value="Дооборудование">Дооборудование</option>
                        <option value="Новое изделие">Новое изделие</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Заголовок *</label>
                <input type="text" id="srTitle" required maxlength="300">
            </div>
            <div class="form-group">
                <label>Содержание работы (описание)</label>
                <textarea id="srDescription" rows="3"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Место, участок</label>
                    <input type="text" id="srLocation">
                </div>
                <div class="form-group">
                    <label>Оборудование</label>
                    <select id="srEquipment"><option value="">— Не выбрано —</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Ответственный</label>
                    <input type="text" id="srResponsible">
                </div>
                <div class="form-group">
                    <label>Необходимая дата</label>
                    <input type="date" id="srNeededBy">
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="srFormCancel">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модалка просмотра + запчасти + файлы + статус -->
<div class="modal-overlay hidden" id="srViewOverlay">
    <div class="modal" style="max-width: 900px;">
        <button class="btn-icon-info" id="srViewClose" style="position:absolute; top:10px; right:10px;">✕</button>
        <h2 id="srViewTitle">Докладная записка</h2>
        <div id="srViewContent" style="font-size:0.9rem;"></div>
    </div>
</div>

<script src="/js/utils/dom.js"></script>
<script src="/js/utils/auth.js"></script>
<script src="/js/components/profile-ui.js"></script>
<script src="/js/components/layout.js"></script>
<script src="/js/pages/service-requests.js"></script>
</body>
</html>
