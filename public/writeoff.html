<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Списание компонентов</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="/" style="color:#fff; text-decoration:none;">📦 Склад</a>
        <span style="margin-left:2rem; font-size:0.9rem;">→ Списание</span>
      </div>
    </div>
  </header>

  <div class="writeoff-form">
    <h2>Заявка на списание</h2>
    <div class="form-group">
      <label>Поиск позиции (по названию или коду)</label>
      <input type="text" id="searchItem" placeholder="Начните вводить..." autocomplete="off">
      <div id="suggestions" class="suggestions hidden"></div>
    </div>
    <div class="form-group">
      <label>Выбранная позиция</label>
      <input type="text" id="selectedItem" readonly>
      <input type="hidden" id="selectedCode">
    </div>
    <div class="form-group">
      <label>Количество для списания *</label>
      <input type="number" id="quantity" step="0.01" min="0.01" required>
    </div>
    <div class="form-group">
      <label>На какое оборудование *</label>
      <select id="equipment" required>
        <option value="">— Выберите —</option>
      </select>
    </div>
    <div class="form-group">
      <label>Кто запрашивает</label>
      <input type="text" id="requestedBy" value="Сотрудник">
    </div>
    <div class="form-group">
      <label>Комментарий</label>
      <textarea id="comment" rows="2"></textarea>
    </div>
    <button class="btn btn-primary" id="submitWriteOff">Отправить заявку</button>
    <p id="message" style="margin-top:1rem;"></p>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const API = '/api/write-offs';
    const INVENTORY_API = '/api/inventory';
    const DIR_API = '/api/directories';

    let allItems = [];
    let currentStock = 0;

    // Загрузка справочника оборудования
    async function loadEquipmentList() {
      try {
        const res = await fetch(`${DIR_API}/equipment`);
        if (!res.ok) throw new Error('Ошибка загрузки оборудования');
        const equips = await res.json();
        const select = $('#equipment');
        select.innerHTML = '<option value="">— Выберите —</option>' +
          equips.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
      } catch (e) {
        console.error('Не удалось загрузить оборудование:', e);
      }
    }

    // Загрузка всех позиций для поиска
    async function loadAllItems() {
      try {
        const res = await fetch(INVENTORY_API);
        if (!res.ok) throw new Error('Ошибка загрузки инвентаря');
        allItems = await res.json();
      } catch (e) {
        console.error('Не удалось загрузить список:', e);
        $('#message').textContent = 'Ошибка загрузки данных для поиска';
      }
    }

    function showSuggestions(query) {
      const cont = $('#suggestions');
      cont.innerHTML = '';
      if (!query.trim()) {
        cont.classList.add('hidden');
        return;
      }
      const q = query.toLowerCase();
      const matches = allItems.filter(i =>
        i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)
      ).slice(0, 10);

      if (matches.length === 0) {
        cont.classList.add('hidden');
        return;
      }
      matches.forEach(item => {
        const div = document.createElement('div');
        div.textContent = `${item.code} – ${item.name} (остаток: ${item.quantity} ${item.unit})`;
        div.addEventListener('click', () => selectItem(item));
        cont.appendChild(div);
      });
      cont.classList.remove('hidden');
    }

    function selectItem(item) {
      $('#selectedItem').value = `${item.code} – ${item.name}`;
      $('#selectedCode').value = item.code;
      currentStock = item.quantity;
      $('#quantity').max = currentStock;
      $('#quantity').value = '';
      $('#suggestions').classList.add('hidden');
      validateQuantity();
    }

    function validateQuantity() {
      const qtyInput = $('#quantity');
      const submitBtn = $('#submitWriteOff');
      const val = parseFloat(qtyInput.value);
      const msgArea = $('#message');

      if (isNaN(val) || val <= 0) {
        submitBtn.disabled = true;
        msgArea.textContent = '';
        return;
      }
      if (val > currentStock) {
        msgArea.textContent = `❌ Нельзя списать больше, чем есть на складе (${currentStock})`;
        submitBtn.disabled = true;
      } else {
        msgArea.textContent = '';
        submitBtn.disabled = false;
      }
    }

    $('#quantity').addEventListener('input', validateQuantity);
    $('#searchItem').addEventListener('input', (e) => showSuggestions(e.target.value));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchItem') && !e.target.closest('#suggestions')) {
        $('#suggestions').classList.add('hidden');
      }
    });

    $('#submitWriteOff').addEventListener('click', async () => {
      const item_code = $('#selectedCode').value;
      const quantity = parseFloat($('#quantity').value);
      const equipment_id = $('#equipment').value;
      const requested_by = $('#requestedBy').value.trim() || 'сотрудник';
      const comment = $('#comment').value.trim();

      if (!item_code || !quantity || quantity <= 0) {
        $('#message').textContent = 'Выберите позицию и укажите количество';
        return;
      }
      if (!equipment_id) {
        $('#message').textContent = '❌ Укажите оборудование, на которое выполняется списание';
        return;
      }
      if (quantity > currentStock) {
        $('#message').textContent = `❌ Количество превышает остаток (${currentStock})`;
        return;
      }

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item_code, equipment_id, quantity, requested_by, comment })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Ошибка сервера');
        }
        $('#message').textContent = '✅ Заявка отправлена';
        $('#selectedItem').value = '';
        $('#selectedCode').value = '';
        $('#quantity').value = '';
        $('#equipment').value = '';
        $('#comment').value = '';
        currentStock = 0;
      } catch(e) {
        $('#message').textContent = '❌ ' + e.message;
      }
    });

    // Автоподстановка позиции из URL
    const urlParams = new URLSearchParams(window.location.search);
    const preselectedCode = urlParams.get('code');

    (async function init() {
      await loadEquipmentList();
      await loadAllItems();

      if (preselectedCode) {
        try {
          const res = await fetch(`${INVENTORY_API}/${encodeURIComponent(preselectedCode)}`);
          if (!res.ok) throw new Error('Не найдена');
          const item = await res.json();
          selectItem(item);
        } catch (e) {
          console.error('Ошибка автоподстановки:', e);
          $('#message').textContent = 'Позиция не найдена в базе';
        }
      }
    })();
  </script>
</body>
</html>
